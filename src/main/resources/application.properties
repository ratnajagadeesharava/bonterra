# stdio MCP server: no web server, no banner, stdout reserved for JSON-RPC (logs go to stderr, see logback.xml).
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false

spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.name=community-bridge
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.instructions=Emergency assistance funding for one nonprofit. Your identity and role are fixed by how this server was launched; call whoami to see them. Amounts are USD decimal strings like "300.50".

# Tools only (MCP-09); tools are registered by McpToolConfig, not by annotation scanning.
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
